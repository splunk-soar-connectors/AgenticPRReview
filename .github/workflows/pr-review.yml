name: PR Review Bot

on:
  workflow_call:
    inputs:
      repo:
        description: Repository to review in owner/name form.
        required: true
        type: string
      pr_number:
        description: Pull request number to review.
        required: true
        type: string
      circuit_base_url:
        description: Full CIRCUIT chat completions endpoint.
        required: true
        type: string
      circuit_model:
        description: CIRCUIT model name.
        required: true
        type: string
      circuit_token_url:
        description: CIRCUIT OAuth token endpoint.
        required: true
        type: string
      circuit_request_timeout_seconds:
        description: Per-request CIRCUIT model timeout in seconds.
        required: false
        type: string
        default: "600"
      circuit_request_max_attempts:
        description: Maximum CIRCUIT model attempts for transient timeout/network failures.
        required: false
        type: string
        default: "2"
      circuit_request_retry_backoff_seconds:
        description: Base delay between CIRCUIT model retries.
        required: false
        type: string
        default: "5"
      deep_concurrency:
        description: Maximum concurrent deep model chunk reviews. 0 lets the bot choose from workload size/risk.
        required: false
        type: string
        default: "0"
      previous_pipeline_results_json:
        description: JSON map of caller workflow job results for CI failure reporting.
        required: false
        type: string
        default: "{}"
      publish_comments:
        description: Publish GitHub comments and apply the ai-reviewed label.
        required: false
        type: boolean
        default: true
    secrets:
      AI_REVIEW_APP_ID:
        required: true
      AI_REVIEW_INSTALLATION_ID:
        required: true
      AI_REVIEW_PRIVATE_KEY:
        required: true
      CIRCUIT_CLIENT_ID:
        required: true
      CIRCUIT_CLIENT_SECRET:
        required: true
      CIRCUIT_APP_KEY:
        required: true

permissions: {}

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Validate trusted caller and target
        env:
          EXPECTED_OWNER: splunk-soar-connectors
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_OWNER: ${{ github.repository_owner }}
          REVIEW_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [[ "${CALLER_OWNER}" != "${EXPECTED_OWNER}" ]]; then
            echo "Untrusted caller owner: ${CALLER_OWNER}"
            exit 1
          fi
          case "${CALLER_REPOSITORY}" in
            "${EXPECTED_OWNER}/"*) ;;
            *)
              echo "Untrusted caller repository: ${CALLER_REPOSITORY}"
              exit 1
              ;;
          esac
          case "${REVIEW_REPO}" in
            "${EXPECTED_OWNER}/"*) ;;
            *)
              echo "Untrusted review target: ${REVIEW_REPO}"
              exit 1
              ;;
          esac

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            AgenticPRReview
            ${{ github.event.repository.name }}

      - name: Checkout review bot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository_owner }}/AgenticPRReview
          path: AgenticPRReview
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Restore and save review checkpoint cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            AgenticPRReview/runs/
            AgenticPRReview/.cache/agentic-pr-review-model/
          key: pr-review-cache-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ inputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pr-review-cache-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ inputs.pr_number }}-
            pr-review-cache-${{ github.repository_owner }}-${{ github.event.repository.name }}-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install review bot
        working-directory: AgenticPRReview
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure ai-reviewed label exists
        if: inputs.publish_comments
        env:
          # gh expects this variable name; the value is the GitHub App installation token, not a PAT.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          gh api "repos/${GH_REPO}/labels/ai-reviewed" --silent >/dev/null 2>&1 || \
            gh api "repos/${GH_REPO}/labels" \
              -f name='ai-reviewed' \
              -f color='5319e7' \
              -f description='Reviewed by the agentic PR review bot' >/dev/null

      - name: Run PR review bot
        working-directory: AgenticPRReview
        env:
          AI_REVIEW_APP_ID: ${{ secrets.AI_REVIEW_APP_ID }}
          AI_REVIEW_INSTALLATION_ID: ${{ secrets.AI_REVIEW_INSTALLATION_ID }}
          AI_REVIEW_PRIVATE_KEY: ${{ secrets.AI_REVIEW_PRIVATE_KEY }}
          MODEL_PROVIDER: circuit
          CIRCUIT_BASE_URL: ${{ inputs.circuit_base_url }}
          CIRCUIT_MODEL: ${{ inputs.circuit_model }}
          CIRCUIT_TOKEN_URL: ${{ inputs.circuit_token_url }}
          CIRCUIT_REQUEST_TIMEOUT_SECONDS: ${{ inputs.circuit_request_timeout_seconds }}
          CIRCUIT_REQUEST_MAX_ATTEMPTS: ${{ inputs.circuit_request_max_attempts }}
          CIRCUIT_REQUEST_RETRY_BACKOFF_SECONDS: ${{ inputs.circuit_request_retry_backoff_seconds }}
          CIRCUIT_CLIENT_ID: ${{ secrets.CIRCUIT_CLIENT_ID }}
          CIRCUIT_CLIENT_SECRET: ${{ secrets.CIRCUIT_CLIENT_SECRET }}
          CIRCUIT_APP_KEY: ${{ secrets.CIRCUIT_APP_KEY }}
          REVIEW_REPO: ${{ inputs.repo }}
          REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_OUTPUT_DIR: ${{ github.workspace }}/AgenticPRReview/runs
          AGENTIC_PR_REVIEW_MODEL_CACHE_DIR: ${{ github.workspace }}/AgenticPRReview/.cache/agentic-pr-review-model
          PREVIOUS_PIPELINE_RESULTS_JSON: ${{ inputs.previous_pipeline_results_json }}
        run: |
          args=(
            review "${REVIEW_REPO}" "${REVIEW_PR_NUMBER}"
            --output-dir "${REVIEW_OUTPUT_DIR}"
            --deep-concurrency "${{ inputs.deep_concurrency }}"
          )
          if [[ "${{ inputs.publish_comments }}" == "true" ]]; then
            args+=(--publish-comments)
          fi
          python -m agentic_pr_review.cli "${args[@]}"

      - name: Upload review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-review-${{ inputs.pr_number }}
          path: AgenticPRReview/runs/
          if-no-files-found: ignore

# This workflow intentionally does not pass --enable-sdk-manifest. It may run
# from pull_request_target callers with repository secrets, so it must not
# execute untrusted PR code.
